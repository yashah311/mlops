name: MLOps SageMaker CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 1. Triggers Training, Evaluation, and Model Package Registration
      - name: Run Orchestration Pipeline
        run: python pipelines/run_pipeline.py

      # 2. Automatically picks up the approved artifact and creates/updates the endpoint
      - name: Deploy Live Inference Endpoint
        run: python pipelines/deploy_endpoint.py

      # 3. 🎯 THE CONCLUSION GATE: Executes integration testing against your endpoint
      - name: Execute Endpoint Integration Test Gate
        run: python tests/test_inference.py
