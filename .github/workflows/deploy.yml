name: MLOps SageMaker CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install core dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Authenticate securely with AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 5. Run SageMaker Workflow Pipeline (Training & Registration)
      - name: Run Orchestration Pipeline
        run: |
          python pipelines/run_pipeline.py

      # 6. Execute Deployment Script to create/update Endpoint
      - name: Deploy Live Inference Endpoint
        run: |
          python pipelines/deploy_endpoint.py
